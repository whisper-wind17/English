name: Prepare Third-party Review and Pronunciation Packets

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_third_party_review_preparation.py'
      - 'tools/check_third_party_review_preparation.py'
      - '.github/workflows/third-party-review-preparation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic pronunciation reference engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng --version

      - name: Build review preparation packets
        run: python tools/build_third_party_review_preparation.py

      - name: Independent packet Completion Recheck
        run: python tools/check_third_party_review_preparation.py

      - name: Assert canonical state is untouched
        run: |
          git diff --exit-code -- \
            anki/klose/master \
            anki/klose/learner \
            anki/klose/publish \
            anki/klose/anki

      - name: Persist review-preparation packets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add anki/klose/third_party_vocabulary/review_preparation
          changed="$(git diff --cached --name-only)"
          bad="$(printf '%s\n' "$changed" | grep -v '^anki/klose/third_party_vocabulary/review_preparation/' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected staged path:'
            echo "$bad"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No review preparation changes.'
          else
            git commit -m 'data: prepare third-party review and pronunciation packets'
            git pull --rebase origin main
            git push
          fi
