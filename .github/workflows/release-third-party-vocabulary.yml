name: Execute Reviewed Third-party Vocabulary Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-third-party-vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pre-release persistent state
        run: |
          KLOSE_BASE_COMMIT=HEAD^ python tools/check_klose_persistent_state.py
          KLOSE_BASE_COMMIT=HEAD^ python tools/check_klose_release_history.py
          python tools/check_third_party_learner_content.py
          python tools/validate_third_party_pronunciation_materialization.py
          python tools/check_klose_learner.py
          python tools/check_klose_release_ready.py

      - name: Dry-run exact reviewed release delta
        run: |
          python tools/release_klose_allowed_vocabulary.py \
            --expected-count 1981 \
            --released-at 2026-09-12 \
            --reason third-party-primary-reviewed-v1

      - name: Append immutable release truth
        run: |
          cp anki/klose/master/release_registry_extensions.csv /tmp/release_registry_extensions.before.csv
          python tools/release_klose_allowed_vocabulary.py \
            --expected-count 1981 \
            --released-at 2026-09-12 \
            --reason third-party-primary-reviewed-v1 \
            --apply
          python - <<'PY'
          from pathlib import Path
          old=Path('/tmp/release_registry_extensions.before.csv').read_bytes()
          new=Path('anki/klose/master/release_registry_extensions.csv').read_bytes()
          if not new.startswith(old):
              raise SystemExit('Release extension historical byte prefix changed')
          print(f'Release append byte-prefix PASS: before={len(old)} bytes after={len(new)} bytes')
          PY
          KLOSE_BASE_COMMIT=HEAD python tools/check_klose_release_history.py

      - name: Commit release truth only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add anki/klose/master/release_registry_extensions.csv
          changed="$(git diff --cached --name-only)"
          if [ "$changed" != 'anki/klose/master/release_registry_extensions.csv' ]; then
            echo 'Unexpected release transaction diff:'
            echo "$changed"
            exit 1
          fi
          git commit -m 'release: publish reviewed third-party vocabulary'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch canonical vocabulary rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-klose-vocabulary.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Canonical Build Klose Vocabulary dispatched on main.'
