name: Resolve Grade 5-6 Source Provenance

on:
  push:
    branches: [main]
    paths:
      - 'anki/klose/source_reference/grade5_6_source_provenance.json'
      - 'tools/resolve_grade5_6_source_provenance.py'
      - '.github/workflows/resolve-grade5-6-source-provenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-grade5-6-source-provenance
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve SourceID and SourceEdition
        run: python tools/resolve_grade5_6_source_provenance.py
      - name: Validate final Source state
        run: python tools/check_grade5_6_actual_textbook_source.py
      - name: Enforce Source-only diff scope
        shell: bash
        run: |
          allowed='^(anki/klose/source_reference/(grade5_6_source_provenance.json|grade5_6_actual_textbook_manifest.csv|klose-actual-grade5-6-vocabulary.csv|klose-actual-grade5-upper-expressions.csv|klose-actual-grade5-lower-expressions.csv|klose-actual-grade6-upper-expressions.csv|klose-actual-grade6-lower-expressions.csv|klose-actual-grade5-lower-proverbs.csv|klose-actual-grade5-6-morphology.csv))$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected mutation outside Grade 5-6 Source provenance scope:'
            echo "$bad"
            exit 1
          fi
      - name: Persist resolved provenance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add \
            anki/klose/source_reference/grade5_6_source_provenance.json \
            anki/klose/source_reference/grade5_6_actual_textbook_manifest.csv \
            anki/klose/source_reference/klose-actual-grade5-6-vocabulary.csv \
            anki/klose/source_reference/klose-actual-grade5-upper-expressions.csv \
            anki/klose/source_reference/klose-actual-grade5-lower-expressions.csv \
            anki/klose/source_reference/klose-actual-grade6-upper-expressions.csv \
            anki/klose/source_reference/klose-actual-grade6-lower-expressions.csv \
            anki/klose/source_reference/klose-actual-grade5-lower-proverbs.csv \
            anki/klose/source_reference/klose-actual-grade5-6-morphology.csv
          if git diff --cached --quiet; then
            echo 'No provenance changes to persist.'
            exit 0
          fi
          git commit -m 'data: resolve Grade 5-6 source provenance'
          git pull --rebase origin main
          git push origin HEAD:main
