name: Audit Vocabulary Pending Review
on:
  push:
    branches: [work/klose-vocab-pending-review-20260910]
    paths:
      - 'tools/_audit_vocab_pending_review.py'
      - 'tools/check_klose_learner.py'
      - '.github/workflows/_audit-vocab-pending-review.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build focused audit
        run: python tools/_audit_vocab_pending_review.py
      - name: Inspect repo IPA evidence for reuse gaps
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          targets={'clean the room','national day','thanksgiving'}
          found={x:[] for x in targets}
          for p in Path('anki').rglob('*.csv'):
              if 'publish' in p.parts or p.name in {'vocabulary_master.csv','vocabulary_pending_focus_audit.csv'}:
                  continue
              try:
                  with p.open(encoding='utf-8-sig',newline='') as f:
                      for r in csv.DictReader(f):
                          values=[]
                          for k in ('Word','CanonicalWord','DisplayWord','Entry','RawEntry','Target'):
                              if r.get(k): values.append(r[k].strip().lower())
                          if not values: continue
                          for t in targets:
                              if t in values:
                                  b=(r.get('British') or r.get('BritishIPA') or '').strip()
                                  a=(r.get('American') or r.get('AmericanIPA') or '').strip()
                                  if b or a: found[t].append((str(p),b,a))
              except (UnicodeDecodeError,csv.Error):
                  pass
          for t in sorted(targets):
              print('IPA-EVIDENCE',t,found[t][:20])
          PY
      - name: Check released-or-admitted learner examples
        run: python tools/check_klose_learner.py
      - name: Persist audit on work branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add anki/klose/review/vocabulary_pending_focus_audit.csv anki/klose/review/future_vocab_review.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: materialize focused vocabulary pending review'
          git push origin HEAD:work/klose-vocab-pending-review-20260910
