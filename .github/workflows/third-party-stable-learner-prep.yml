name: Third-party Stable Learner Preparation

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_third_party_stable_learner_prep.py'
      - 'tools/check_third_party_stable_learner_prep.py'
      - '.github/workflows/third-party-stable-learner-prep.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: third-party-stable-learner-prep
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture protected-layer baseline
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            anki/klose/learner/current.csv \
            anki/klose/learner/learning_admission.csv \
            anki/klose/learner/presentation_review_registry.csv \
            anki/klose/master/release_registry.csv \
            anki/klose/master/release_registry_extensions.csv \
            anki/klose/publish/study.csv \
            anki/klose/publish/anki-import.csv; do
            printf '%s %s\n' "$(git hash-object "$p")" "$p"
          done > "$RUNNER_TEMP/protected-before.txt"
          cat "$RUNNER_TEMP/protected-before.txt"

      - name: Regenerate stable learner preparation
        run: python tools/build_third_party_stable_learner_prep.py

      - name: Independently validate preparation
        run: python tools/check_third_party_stable_learner_prep.py

      - name: Assert persisted generated state is deterministic
        run: |
          git diff --exit-code -- \
            anki/klose/third_party_vocabulary/learner/stable_learner_plan.json \
            anki/klose/third_party_vocabulary/learner/stable_learner_scope.csv \
            anki/klose/third_party_vocabulary/learner/stable_learning_admission_plan.csv \
            anki/klose/third_party_vocabulary/learner/stable_presentation_candidates.csv

      - name: Assert protected learner/release/publish layers unchanged
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            anki/klose/learner/current.csv \
            anki/klose/learner/learning_admission.csv \
            anki/klose/learner/presentation_review_registry.csv \
            anki/klose/master/release_registry.csv \
            anki/klose/master/release_registry_extensions.csv \
            anki/klose/publish/study.csv \
            anki/klose/publish/anki-import.csv; do
            printf '%s %s\n' "$(git hash-object "$p")" "$p"
          done > "$RUNNER_TEMP/protected-after.txt"
          diff -u "$RUNNER_TEMP/protected-before.txt" "$RUNNER_TEMP/protected-after.txt"
          git diff --check
          echo 'Third-party Stable learner preparation Completion Recheck = PASS'
          echo 'Official learner/admission/release/publish/Anki mutation = no'
