name: Rebuild After Third-party Vocabulary Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-after-third-party-release.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm committed release is already closed
        run: |
          python tools/release_klose_allowed_vocabulary.py \
            --expected-count 0 \
            --released-at 2026-09-12 \
            --reason third-party-primary-reviewed-v1
          python - <<'PY'
          import csv
          from pathlib import Path
          base=Path('anki/klose/master')
          def read(p):
              with p.open('r',encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          total=len(read(base/'release_registry.csv'))+len(read(base/'release_registry_extensions.csv'))
          if total!=2953:
              raise SystemExit(f'Expected committed release total 2953, got {total}')
          print('Committed release total = 2953')
          PY
      - name: Dispatch canonical build on post-release main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-klose-vocabulary.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Post-release canonical build dispatched.'
