# one-shot raw schema audit trigger v2
name: Audit Third-party Raw XLSX Structure

on:
  push:
    paths:
      - '.github/workflows/audit-third-party-raw-xlsx-schema.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect raw XLSX schema without modifying data
        run: |
          python - <<'PY'
          from __future__ import annotations
          import re, zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root = Path('1.全国各大教材版本中小学同步')
          families = {
              'beijing_start1': (root/'北京版', '北京版一年级起点'),
              'renjiao_start1': (root/'人教版', '人教版一年级起点'),
              'renjiao_start3': (root/'人教版', '人教版三年级起点'),
              'hujiao_start3': (root/'沪教版', '沪教版三年级起点'),
              'waiyan_start1': (root/'外研版', '外研版一年级起点'),
          }
          ns = '{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'

          def shared_strings(zf):
              name='xl/sharedStrings.xml'
              if name not in zf.namelist(): return []
              r=ET.fromstring(zf.read(name))
              return [''.join(t.text or '' for t in si.iter(f'{ns}t')) for si in r.findall(f'{ns}si')]

          def cell_value(c, strings):
              typ=c.attrib.get('t','')
              if typ=='inlineStr':
                  n=c.find(f'{ns}is')
                  return '' if n is None else ''.join(t.text or '' for t in n.iter(f'{ns}t'))
              n=c.find(f'{ns}v'); raw='' if n is None else (n.text or '')
              return strings[int(raw)] if typ=='s' and raw else raw

          def col_idx(ref):
              letters=''.join(ch for ch in ref if ch.isalpha()).upper(); n=0
              for ch in letters: n=n*26+ord(ch)-64
              return n-1

          def inspect(path):
              with zipfile.ZipFile(path) as zf:
                  strings=shared_strings(zf)
                  sheets=sorted(n for n in zf.namelist() if n.startswith('xl/worksheets/sheet') and n.endswith('.xml'))
                  data=[]
                  for sheet in sheets:
                      r=ET.fromstring(zf.read(sheet)); rows=[]; maxcol=-1
                      for row in r.iter(f'{ns}row'):
                          vals={}
                          for c in row.findall(f'{ns}c'):
                              i=col_idx(c.attrib.get('r','A1')); v=cell_value(c,strings).strip()
                              if v: vals[i]=v; maxcol=max(maxcol,i)
                          if vals: rows.append((int(row.attrib.get('r','0') or 0), vals))
                      data.append((sheet, rows, maxcol))
                  return data

          for family,(folder,prefix) in families.items():
              if not folder.exists():
                  print(f'FAMILY {family}: folder missing: {folder}')
                  continue
              files=sorted(p for p in folder.glob('*.xlsx') if p.name.startswith(prefix))
              expected = 12 if family in {'beijing_start1','renjiao_start1','waiyan_start1'} else 8
              print(f'=== FAMILY {family} files={len(files)} expected={expected} ===')
              for p in files:
                  sheets=inspect(p)
                  global_max=max((x[2] for x in sheets), default=-1)
                  extra_rows=0; structural=[]; headers=[]
                  for sheet,rows,maxcol in sheets:
                      for rno,vals in rows:
                          joined='|'.join(vals.values())
                          if '单词' in joined and '释义' in joined:
                              headers.append((sheet,rno,[vals.get(i,'') for i in range(max(vals)+1)]))
                          if any(i>=4 for i in vals): extra_rows += 1
                          alltext='|'.join(vals.values())
                          if re.search(r'(?i)\b(unit|module|lesson)\b|单元|模块|课', alltext):
                              structural.append((sheet,rno,alltext[:160]))
                  print(f'{p.name}: sheets={len(sheets)} max_nonempty_col={global_max+1} rows_with_Eplus={extra_rows} headers={headers[:2]} structural={structural[:8]}')
          PY
