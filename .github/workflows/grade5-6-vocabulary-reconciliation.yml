name: Grade 5-6 Vocabulary Reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_grade5_6_vocabulary_reconciliation.py'
      - 'tools/apply_grade5_6_vocabulary_review.py'
      - 'tools/prepare_grade5_6_vocabulary_review.py'
      - 'anki/klose/source_reference/klose-actual-grade5-6-vocabulary.csv'
      - 'anki/klose/source_reference/klose-actual-grade5-6-morphology.csv'
      - 'anki/klose/master/note_registry.csv'
      - 'anki/klose/master/note_registry_extensions.csv'
      - 'anki/klose/review/grade5_6_reconciliation/vocabulary_reviewed_batch.csv'
      - '.github/workflows/grade5-6-vocabulary-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grade5-6-vocabulary-reconciliation
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # event.before is the immediately preceding user/bot-visible checkpoint;
          # two commits are sufficient for the persistent-state baseline check and
          # avoid fetching the repository's full review history on every 50-row batch.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build review candidates
        run: python tools/build_grade5_6_vocabulary_reconciliation.py
      - name: Apply transient reviewed batch
        run: python tools/apply_grade5_6_vocabulary_review.py
      - name: Seed deterministic decisions and next batch
        run: python tools/prepare_grade5_6_vocabulary_review.py
      - name: Verify Stable Klose state
        env:
          KLOSE_BASE_COMMIT: ${{ github.event.before || 'HEAD^' }}
        run: python tools/check_klose_persistent_state.py
      - name: Enforce review-only diff scope
        shell: bash
        run: |
          bad="$(git diff --name-only | grep -v '^anki/klose/review/grade5_6_reconciliation/' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected mutation outside Grade 5-6 reconciliation review scope:"
            echo "$bad"
            exit 1
          fi
      - name: Persist derived review state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add -A anki/klose/review/grade5_6_reconciliation
          if git diff --cached --quiet; then
            echo 'No reconciliation review changes.'
            exit 0
          fi
          git commit -m 'data: refresh Grade 5-6 vocabulary reconciliation review'
          git pull --rebase origin main
          git push origin HEAD:main
