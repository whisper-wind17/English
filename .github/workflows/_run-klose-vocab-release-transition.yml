name: Run Klose Vocabulary Release Transition

on:
  push:
    branches:
      - work/klose-vocab-release-20260910
    paths:
      - .github/workflows/_run-klose-vocab-release-transition.yml
      - tools/_prepare_klose_vocab_release_transition.py

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare exact release transition
        run: python tools/_prepare_klose_vocab_release_transition.py

      - name: Verify append-only release result
        run: |
          git fetch origin main
          export KLOSE_BASE_COMMIT="$(git merge-base HEAD origin/main)"
          python tools/check_klose_release_history.py
          python tools/release_klose_allowed_vocabulary.py --expected-count 0 --released-at 2026-09-10 --reason grade5-6-current-reviewed-v1
          python -m py_compile tools/release_klose_allowed_vocabulary.py tools/apply_klose_release_extensions.py tools/check_klose_release_history.py tools/apply_klose_actual_grade4.py tools/check_klose_grade5_6_current_merge.py

      - name: Commit durable release transition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add tools/apply_klose_actual_grade4.py tools/check_klose_grade5_6_current_merge.py anki/klose/master/release_registry_extensions.csv
          git diff --cached --check
          git commit -m 'release: allocate reviewed Grade 5-6 vocabulary'
          git push
