name: Prepare Klose Beijing Vocabulary Staging

on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_klose_beijing_vocabulary.py'
      - 'tools/audit_klose_beijing_source_variants.py'
      - 'tools/build_klose_beijing_premerge_map.py'
      - 'tools/check_klose_beijing_premerge.py'
      - '1.全国各大教材版本中小学同步/北京版/**'
      - 'anki/klose/master/note_registry.csv'
      - 'anki/klose/master/note_registry_extensions.csv'
      - 'anki/klose/source_reference/beijing_start1_staging/identity_resolution_review.csv'
      - 'anki/klose/source_reference/beijing_start1_staging/source_variant_resolution_review.csv'
      - 'anki/klose/source_reference/beijing_start1_staging/semantic_resolution_review.csv'
      - '.github/workflows/prepare-klose-beijing-vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build non-publishing Beijing staging data
        run: python tools/prepare_klose_beijing_vocabulary.py

      - name: Audit source and existing-identity inflection variants
        run: python tools/audit_klose_beijing_source_variants.py

      - name: Consolidate occurrence-level pre-merge decisions
        run: python tools/build_klose_beijing_premerge_map.py

      - name: Validate pre-merge review coverage and merge lock
        run: python tools/check_klose_beijing_premerge.py

      - name: Assert Klose publishing state is untouched
        run: |
          git diff --exit-code -- \
            anki/klose/master/note_registry.csv \
            anki/klose/master/note_registry_extensions.csv \
            anki/klose/master/source_occurrences.csv \
            anki/klose/master/release_registry.csv \
            anki/klose/master/release_registry_extensions.csv \
            anki/klose/learner \
            anki/klose/publish

      - name: Persist staging outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add anki/klose/source_reference/beijing_start1_staging
          if git diff --cached --quiet; then
            echo 'No Beijing staging changes.'
          else
            git commit -m 'data: refresh Beijing vocabulary pre-merge staging'
            git push
          fi
