name: Restore Stage-B Checkpoint After Release Isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-stage-b-after-release-isolation.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Stage-B audit snapshot from pre-refresh commit
        run: |
          git checkout 13a10ba78cb28677c3e01ec32a7d386557c42953 -- \
            anki/klose/third_party_vocabulary/premerge/identity_candidates.csv \
            anki/klose/third_party_vocabulary/premerge/readiness.json \
            anki/klose/third_party_vocabulary/premerge/reconciliation_next_batch.json \
            anki/klose/third_party_vocabulary/premerge/reconciliation_review_queue.csv \
            anki/klose/third_party_vocabulary/premerge/reconciliation_selected_view.csv \
            anki/klose/third_party_vocabulary/reconciliation/reconciliation_decisions.csv
          git diff --exit-code 13a10ba78cb28677c3e01ec32a7d386557c42953 -- \
            anki/klose/third_party_vocabulary/premerge/identity_candidates.csv \
            anki/klose/third_party_vocabulary/premerge/readiness.json \
            anki/klose/third_party_vocabulary/premerge/reconciliation_next_batch.json \
            anki/klose/third_party_vocabulary/premerge/reconciliation_review_queue.csv \
            anki/klose/third_party_vocabulary/premerge/reconciliation_selected_view.csv \
            anki/klose/third_party_vocabulary/reconciliation/reconciliation_decisions.csv
      - name: Commit restored Stage-B audit snapshot without retriggering CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add \
            anki/klose/third_party_vocabulary/premerge/identity_candidates.csv \
            anki/klose/third_party_vocabulary/premerge/readiness.json \
            anki/klose/third_party_vocabulary/premerge/reconciliation_next_batch.json \
            anki/klose/third_party_vocabulary/premerge/reconciliation_review_queue.csv \
            anki/klose/third_party_vocabulary/premerge/reconciliation_selected_view.csv \
            anki/klose/third_party_vocabulary/reconciliation/reconciliation_decisions.csv
          if git diff --cached --quiet; then
            echo 'Stage-B checkpoint already restored.'
          else
            git commit -m 'fix: restore Stage-B audit checkpoint after release isolation [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
