name: Grade 5-6 Premerge Dedup Audit

on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_grade5_6_premerge_dedup.py'
      - 'tools/check_grade5_6_premerge_dedup.py'
      - 'anki/klose/master/note_registry.csv'
      - 'anki/klose/master/note_registry_extensions.csv'
      - 'anki/klose/review/grade5_6_premerge_dedup/decisions.csv'
      - '.github/workflows/grade5-6-premerge-dedup-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grade5-6-premerge-dedup-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools
            anki/klose/master
            anki/klose/review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify persistent identity state
        env:
          KLOSE_BASE_COMMIT: ${{ github.event.before || 'HEAD^' }}
        run: python tools/check_klose_persistent_state.py
      - name: Build dedup candidate audit
        run: python tools/audit_grade5_6_premerge_dedup.py
      - name: Verify reviewed dedup closure
        run: python tools/check_grade5_6_premerge_dedup.py
      - name: Enforce audit-only diff scope
        shell: bash
        run: |
          bad="$(git diff --name-only | grep -Ev '^anki/klose/review/grade5_6_premerge_dedup/(candidates.csv|status.json)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected mutation outside dedup review output:'
            echo "$bad"
            exit 1
          fi
      - name: Persist dedup audit output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add anki/klose/review/grade5_6_premerge_dedup/candidates.csv anki/klose/review/grade5_6_premerge_dedup/status.json
          if git diff --cached --quiet; then
            echo 'Dedup audit output unchanged.'
            exit 0
          fi
          git commit -m 'data: build Grade 5-6 premerge dedup audit'
          git pull --rebase origin main
          git push origin HEAD:main
