name: Third-party Stage-B Identity Reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'tools/check_third_party_stage_b_reconciliation.py'
      - 'tools/build_third_party_klose_premerge.py'
      - 'tools/check_third_party_klose_premerge.py'
      - 'tools/plan_third_party_stage_b_reconciliation.py'
      - 'tools/check_third_party_stage_b_review_plan.py'
      - 'tools/apply_third_party_stage_b_reconciliation_updates.py'
      - 'tools/seal_third_party_stage_a_checkpoint.py'
      - 'anki/klose/third_party_vocabulary/reconciliation/reconciliation_decisions.csv'
      - 'anki/klose/third_party_vocabulary/reconciliation/decision_updates.csv'
      - 'anki/klose/third_party_vocabulary/audit/stage_a_status.json'
      - 'anki/klose/third_party_vocabulary/premerge/identity_candidates.csv'
      - 'anki/klose/third_party_vocabulary/premerge/readiness.json'
      - 'anki/klose/third_party_vocabulary/premerge/reconciliation_review_queue.csv'
      - 'anki/klose/third_party_vocabulary/premerge/reconciliation_selected_view.csv'
      - 'anki/klose/third_party_vocabulary/premerge/reconciliation_next_batch.json'
      - 'anki/klose/master/note_registry.csv'
      - 'anki/klose/master/note_registry_extensions.csv'
      - 'anki/klose/master/identity_migrations.csv'
      - '.github/workflows/third-party-stage-b-reconciliation.yml'
  workflow_run:
    workflows: ['Third-party Stage-B Premerge Readiness']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: third-party-stage-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconciliation:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed Stage-A checkpoint
        run: python tools/seal_third_party_stage_a_checkpoint.py verify

      - name: Rebuild current read-only premerge candidates
        run: python tools/build_third_party_klose_premerge.py

      - name: Verify current premerge snapshot
        run: python tools/check_third_party_klose_premerge.py

      - name: Read premerge gate
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path('anki/klose/third_party_vocabulary/premerge/readiness.json')
          status = json.loads(path.read_text(encoding='utf-8-sig'))
          ready = status.get('ReadyForPremergeReview') is True
          print(f"ready={'true' if ready else 'false'}")
          PY

      - name: Plan current Stage-B reconciliation review
        if: steps.gate.outputs.ready == 'true'
        run: python tools/plan_third_party_stage_b_reconciliation.py

      - name: Check current Stage-B review plan
        if: steps.gate.outputs.ready == 'true'
        run: python tools/check_third_party_stage_b_review_plan.py

      - name: Apply transient Stage-B reconciliation decisions
        if: steps.gate.outputs.ready == 'true'
        run: python tools/apply_third_party_stage_b_reconciliation_updates.py

      - name: Check durable Stage-B reconciliation decisions
        if: steps.gate.outputs.ready == 'true'
        run: python tools/check_third_party_stage_b_reconciliation.py

      - name: Re-plan after reviewed decision apply
        if: steps.gate.outputs.ready == 'true'
        run: python tools/plan_third_party_stage_b_reconciliation.py

      - name: Check next Stage-B review plan
        if: steps.gate.outputs.ready == 'true'
        run: python tools/check_third_party_stage_b_review_plan.py

      - name: Report Stage-B reconciliation gate
        if: steps.gate.outputs.ready != 'true'
        run: |
          echo 'Stage-B reconciliation is gated by current Stage-A review work.'
          echo 'No reconciliation decision validation or mutation is authorized.'

      - name: Assert reconciliation scope and Klose isolation
        shell: bash
        run: |
          git status --short
          unexpected="$(git diff --name-only | grep -Ev '^anki/klose/third_party_vocabulary/(premerge|reconciliation)/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Stage-B review mutated files outside premerge/reconciliation:'
            echo "$unexpected"
            exit 1
          fi
          git diff --exit-code -- \
            anki/klose/master \
            anki/klose/learner \
            anki/klose/publish \
            anki/klose/anki
          echo 'Klose identity/learner/release/Anki isolation = pass'

      - name: Persist Stage-B review truth and derived plan only
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add -A \
            anki/klose/third_party_vocabulary/premerge \
            anki/klose/third_party_vocabulary/reconciliation
          if git diff --cached --quiet; then
            echo 'No Stage-B reconciliation review changes.'
          else
            git commit -m 'data: refresh third-party Stage-B reconciliation review'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
