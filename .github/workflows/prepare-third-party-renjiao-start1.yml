name: Prepare Third-party Vocabulary Stage A

on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_third_party_renjiao_start1.py'
      - 'tools/check_third_party_renjiao_start1.py'
      - 'tools/prepare_third_party_renjiao_start3.py'
      - 'tools/check_third_party_renjiao_start3.py'
      - 'tools/prepare_third_party_hujiao_start3.py'
      - 'tools/check_third_party_hujiao_start3.py'
      - 'tools/prepare_third_party_waiyan_start1.py'
      - 'tools/check_third_party_waiyan_start1.py'
      - 'tools/review_waiyan_start1_new_surfaces.py'
      - 'tools/apply_third_party_identity_decision_updates.py'
      - 'tools/build_third_party_corpus.py'
      - 'tools/check_third_party_corpus.py'
      - '1.全国各大教材版本中小学同步/人教版/人教版一年级起点*.xlsx'
      - '1.全国各大教材版本中小学同步/人教版/人教版三年级起点*.xlsx'
      - '1.全国各大教材版本中小学同步/沪教版/沪教版三年级起点*.xlsx'
      - '1.全国各大教材版本中小学同步/外研版/外研版一年级起点*.xlsx'
      - 'anki/klose/source_reference/beijing_start1_staging/occurrences.csv'
      - 'anki/klose/third_party_vocabulary/config/source_adapters.csv'
      - 'anki/klose/third_party_vocabulary/review/identity_decisions.csv'
      - 'anki/klose/third_party_vocabulary/review/decision_updates.csv'
      - '.github/workflows/prepare-third-party-renjiao-start1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse Renjiao start1 source adapter
        run: python tools/prepare_third_party_renjiao_start1.py

      - name: Validate Renjiao start1 source adapter
        run: python tools/check_third_party_renjiao_start1.py

      - name: Parse Renjiao start3 source adapter
        run: python tools/prepare_third_party_renjiao_start3.py

      - name: Validate Renjiao start3 source adapter
        run: python tools/check_third_party_renjiao_start3.py

      - name: Parse Hujiao start3 source adapter
        run: python tools/prepare_third_party_hujiao_start3.py

      - name: Validate Hujiao start3 source adapter
        run: python tools/check_third_party_hujiao_start3.py

      - name: Parse Waiyan start1 source adapter
        run: python tools/prepare_third_party_waiyan_start1.py

      - name: Validate Waiyan start1 source adapter
        run: python tools/check_third_party_waiyan_start1.py

      - name: Prepare conservative Waiyan new-surface review inbox
        run: python tools/review_waiyan_start1_new_surfaces.py

      - name: Apply transient reviewed identity decisions
        run: python tools/apply_third_party_identity_decision_updates.py

      - name: Build simplified third-party corpus workspace
        run: python tools/build_third_party_corpus.py

      - name: Independent third-party Completion Recheck
        run: python tools/check_third_party_corpus.py

      - name: Assert Klose publishing state is untouched
        run: |
          git diff --exit-code -- \
            anki/klose/master \
            anki/klose/learner \
            anki/klose/publish \
            anki/klose/anki

      - name: Persist third-party Stage A data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add -A \
            anki/klose/third_party_vocabulary/review \
            anki/klose/source_reference/renjiao_start1_staging/README.md \
            anki/klose/source_reference/renjiao_start1_staging/occurrences.csv \
            anki/klose/source_reference/renjiao_start3_staging/README.md \
            anki/klose/source_reference/renjiao_start3_staging/occurrences.csv \
            anki/klose/source_reference/hujiao_start3_staging/README.md \
            anki/klose/source_reference/hujiao_start3_staging/occurrences.csv \
            anki/klose/source_reference/waiyan_start1_staging/README.md \
            anki/klose/source_reference/waiyan_start1_staging/occurrences.csv \
            anki/klose/third_party_vocabulary/staging/README.md \
            anki/klose/third_party_vocabulary/staging/occurrences.csv \
            anki/klose/third_party_vocabulary/staging/surface_candidates.csv \
            anki/klose/third_party_vocabulary/staging/review_queue.csv \
            anki/klose/third_party_vocabulary/staging/unified_vocabulary_preview.csv
          if git diff --cached --quiet; then
            echo 'No simplified Stage A changes.'
          else
            git commit -m 'data: refresh simplified third-party Stage A workspace'
            git push
          fi
