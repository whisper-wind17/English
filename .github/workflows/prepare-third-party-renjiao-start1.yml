name: Prepare Third-party Renjiao Start1 Vocabulary

on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_third_party_renjiao_start1.py'
      - 'tools/check_third_party_renjiao_start1.py'
      - 'tools/build_third_party_vocabulary_stage_a.py'
      - 'tools/audit_third_party_cross_source_semantics.py'
      - 'tools/build_third_party_cross_source_resolution.py'
      - 'tools/apply_third_party_cross_source_second_pass.py'
      - 'tools/recheck_third_party_beijing_renjiao_stage_a.py'
      - 'tools/sync_third_party_status_to_next.py'
      - '1.全国各大教材版本中小学同步/人教版/人教版一年级起点*.xlsx'
      - 'anki/klose/source_reference/beijing_start1_staging/occurrences.csv'
      - 'anki/klose/source_reference/beijing_start1_staging/semantic_resolution_review.csv'
      - 'anki/klose/third_party_vocabulary/review/renjiao_start1_morphology_resolution.csv'
      - '.github/workflows/prepare-third-party-renjiao-start1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Renjiao start1 Stage A staging
        run: python tools/prepare_third_party_renjiao_start1.py

      - name: Validate Renjiao Stage A staging
        run: python tools/check_third_party_renjiao_start1.py

      - name: Build combined third-party Stage A workspace
        run: python tools/build_third_party_vocabulary_stage_a.py

      - name: Build context-rich cross-source semantic review queues
        run: python tools/audit_third_party_cross_source_semantics.py

      - name: Build first-pass cross-source Identity Resolution
        run: python tools/build_third_party_cross_source_resolution.py

      - name: Apply second-pass semantic review
        run: python tools/apply_third_party_cross_source_second_pass.py

      - name: Independent Completion Recheck
        run: python tools/recheck_third_party_beijing_renjiao_stage_a.py

      - name: Sync third-party progress to NEXT
        run: python tools/sync_third_party_status_to_next.py

      - name: Assert Klose publishing state is untouched
        run: |
          git diff --exit-code -- \
            anki/klose/master \
            anki/klose/learner \
            anki/klose/publish \
            anki/klose/anki

      - name: Persist third-party staging outputs and status only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add \
            anki/klose/source_reference/renjiao_start1_staging \
            anki/klose/third_party_vocabulary/staging \
            NEXT.md
          if git diff --cached --quiet; then
            echo 'No third-party staging/status changes.'
          else
            git commit -m 'data: refresh Beijing + Renjiao third-party Stage A staging'
            git push
          fi
