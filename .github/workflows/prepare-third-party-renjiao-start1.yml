name: Prepare Third-party Vocabulary Stage A

on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_third_party_*.py'
      - 'tools/check_third_party_*.py'
      - 'tools/apply_third_party_identity_decision_updates.py'
      - 'tools/build_third_party_corpus.py'
      - 'tools/build_third_party_learner_view.py'
      - 'tools/build_third_party_review_bundle.py'
      - 'tools/normalize_third_party_review_lanes.py'
      - 'tools/plan_third_party_review_batch.py'
      - 'tools/propose_third_party_policy_decisions.py'
      - 'tools/recheck_third_party_audit_batch.py'
      - 'tools/seal_third_party_stage_a_checkpoint.py'
      - '1.全国各大教材版本中小学同步/**/*.xlsx'
      - 'anki/klose/source_reference/*_staging/occurrences.csv'
      - 'anki/klose/third_party_vocabulary/config/source_adapters.csv'
      - 'anki/klose/third_party_vocabulary/config/source_freeze.json'
      - 'anki/klose/third_party_vocabulary/review/identity_decisions.csv'
      - 'anki/klose/third_party_vocabulary/review/decision_updates.csv'
      - 'anki/klose/third_party_vocabulary/review/batch_manifest.json'
      - 'anki/klose/third_party_vocabulary/learner/grammar_form_quarantine.csv'
      - 'anki/klose/third_party_vocabulary/learner/content_exclusion_policy.csv'
      - '.github/workflows/prepare-third-party-renjiao-start1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: third-party-stage-a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'push' ||
      github.actor != 'github-actions[bot]' ||
      github.event.head_commit.message != 'data: refresh simplified third-party Stage A workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect source-adapter changes
        id: scope
        shell: bash
        run: |
          source_changed=true
          if [[ "${{ github.event_name }}" == "push" ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > /tmp/third_party_changed_files.txt
            source_changed=false
            while IFS= read -r path; do
              case "$path" in
                tools/prepare_third_party_*.py|\
                1.全国各大教材版本中小学同步/*|\
                anki/klose/source_reference/*_staging/occurrences.csv|\
                anki/klose/third_party_vocabulary/config/source_adapters.csv|\
                .github/workflows/prepare-third-party-renjiao-start1.yml)
                  source_changed=true
                  break
                  ;;
                tools/check_third_party_*.py)
                  adapter_id="${path#tools/check_third_party_}"
                  adapter_id="${adapter_id%.py}"
                  if [[ -f "tools/prepare_third_party_${adapter_id}.py" ]]; then
                    source_changed=true
                    break
                  fi
                  ;;
              esac
            done < /tmp/third_party_changed_files.txt
          fi
          echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"
          echo "Source adapter refresh required = $source_changed"
          if [[ -f /tmp/third_party_changed_files.txt ]]; then
            cat /tmp/third_party_changed_files.txt
          fi

      - name: Forbid mixed source and decision mutation
        if: steps.scope.outputs.source_changed == 'true'
        run: |
          if [[ -f anki/klose/third_party_vocabulary/review/decision_updates.csv ]]; then
            echo 'Do not combine source/config changes with a planned decision batch.'
            exit 1
          fi

      - name: Require deterministic selected-batch closure
        run: python tools/check_third_party_batch_manifest.py

      - name: Capture transient audit decision batch
        run: python tools/recheck_third_party_audit_batch.py capture

      - name: Parse discovered source adapters
        if: steps.scope.outputs.source_changed == 'true'
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          pattern = re.compile(r"prepare_third_party_([a-z0-9_]+)\.py$")
          adapters = []
          for script in sorted(Path('tools').glob('prepare_third_party_*.py')):
              match = pattern.fullmatch(script.name)
              if match:
                  adapters.append((match.group(1), script))
          if not adapters:
              raise SystemExit('No third-party source adapter parsers discovered')
          print(f'discovered source parsers = {len(adapters)}')
          for source_id, script in adapters:
              print(f'parse adapter = {source_id}')
              subprocess.run(['python', str(script)], check=True)
          PY

      - name: Validate discovered source adapters
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          pattern = re.compile(r"prepare_third_party_([a-z0-9_]+)\.py$")
          checked = 0
          for prepare in sorted(Path('tools').glob('prepare_third_party_*.py')):
              match = pattern.fullmatch(prepare.name)
              if not match:
                  continue
              source_id = match.group(1)
              checker = Path('tools') / f'check_third_party_{source_id}.py'
              if not checker.exists():
                  print(f'candidate adapter has no frozen checker yet = {source_id}')
                  continue
              print(f'check adapter = {source_id}')
              subprocess.run(['python', str(checker)], check=True)
              checked += 1
          if not checked:
              raise SystemExit('No dedicated source adapter checkers discovered')
          print(f'dedicated source checkers passed = {checked}')
          PY

      - name: Validate enabled source-adapter closure
        run: python tools/check_third_party_source_adapters.py

      - name: Apply transient reviewed identity decisions
        run: |
          python tools/apply_third_party_identity_decision_updates.py
          rm -f anki/klose/third_party_vocabulary/review/batch_manifest.json

      - name: Build simplified third-party corpus workspace
        run: python tools/build_third_party_corpus.py

      - name: Enforce Third-party SOURCE FREEZE
        run: python tools/check_third_party_source_freeze.py

      - name: Require learner-facing TargetSense in Vocabulary Preview
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('anki/klose/third_party_vocabulary/staging/unified_vocabulary_preview.csv')
          with path.open('r', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          missing = [r['CanonicalMatchKey'] for r in rows if not r.get('TargetSense', '').strip()]
          if missing:
            raise SystemExit(f'Vocabulary Preview has empty TargetSense ({len(missing)}): {missing[:50]}')
          print(f'Vocabulary Preview TargetSense complete = {len(rows)} / {len(rows)}')
          PY

      - name: Independent third-party Completion Recheck
        run: python tools/check_third_party_corpus.py

      - name: Build learner-stage vocabulary view
        run: python tools/build_third_party_learner_view.py

      - name: Check learner-stage admission gates
        run: python tools/check_third_party_learner_view.py

      - name: Build high-throughput blocker review bundle
        run: python tools/build_third_party_review_bundle.py

      - name: Normalize audited blockers with context invalidation
        run: python tools/normalize_third_party_review_lanes.py

      - name: Build deterministic policy decision proposals
        run: python tools/propose_third_party_policy_decisions.py

      - name: Plan evidence-weighted next review batch
        run: python tools/plan_third_party_review_batch.py

      - name: Independent audit-batch Completion Recheck
        run: python tools/recheck_third_party_audit_batch.py verify

      - name: Assert Klose publishing state is untouched
        run: |
          git diff --exit-code -- \
            anki/klose/master \
            anki/klose/learner \
            anki/klose/publish \
            anki/klose/anki

      - name: Seal validated Stage-A checkpoint
        run: python tools/seal_third_party_stage_a_checkpoint.py seal

      - name: Persist third-party Stage A data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add -A \
            anki/klose/third_party_vocabulary/review \
            anki/klose/third_party_vocabulary/audit \
            anki/klose/third_party_vocabulary/learner \
            anki/klose/source_reference/*_staging/README.md \
            anki/klose/source_reference/*_staging/occurrences.csv \
            anki/klose/third_party_vocabulary/staging/README.md \
            anki/klose/third_party_vocabulary/staging/occurrences.csv \
            anki/klose/third_party_vocabulary/staging/surface_candidates.csv \
            anki/klose/third_party_vocabulary/staging/review_queue.csv \
            anki/klose/third_party_vocabulary/staging/unified_vocabulary_preview.csv
          if git diff --cached --quiet; then
            echo 'No simplified Stage A changes.'
          else
            git commit -m 'data: refresh simplified third-party Stage A workspace'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
