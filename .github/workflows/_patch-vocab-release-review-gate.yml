name: Patch Vocabulary Release Review Gate

on:
  push:
    branches:
      - work/klose-vocab-release-gate-20260910
    paths:
      - 'tools/_patch_vocab_release_review_gate.py'
      - '.github/workflows/_patch-vocab-release-review-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python tools/_patch_vocab_release_review_gate.py

      - name: Syntax check
        run: |
          python -m py_compile \
            tools/check_klose_release_ready.py \
            tools/sync_klose_learner_review_registry.py \
            tools/approve_klose_learner_review.py

      - name: Validate pre-release review scope
        run: |
          cp anki/klose/learner/presentation_review_registry.csv /tmp/presentation_review_registry.csv
          cp anki/klose/master/build_stats.csv /tmp/build_stats.csv
          output="$(python tools/sync_klose_learner_review_registry.py)"
          echo "$output"
          echo "$output" | grep -q 'required=972'
          echo "$output" | grep -q 'admitted_allowed=627'
          git restore -- anki/klose/learner/presentation_review_registry.csv anki/klose/master/build_stats.csv

      - name: Ensure approval CLI supports pending-only
        run: python tools/approve_klose_learner_review.py --help | grep -q -- '--pending-only'

      - name: Remove one-shot patch machinery
        run: rm tools/_patch_vocab_release_review_gate.py .github/workflows/_patch-vocab-release-review-gate.yml

      - name: Commit patched durable tools
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add -A
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(tools/check_klose_release_ready.py|tools/sync_klose_learner_review_registry.py|tools/approve_klose_learner_review.py|tools/_patch_vocab_release_review_gate.py|.github/workflows/_patch-vocab-release-review-gate.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected patch diff:'
            echo "$bad"
            exit 1
          fi
          git commit -m 'fix: align vocabulary release and pre-release review scope'
          git push origin HEAD:work/klose-vocab-release-gate-20260910
