name: Repair Jijiao Corpus Checker Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-jijiao-corpus-checker.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Restore full checker and apply minimal baseline patch
        shell: bash
        run: |
          git show 6cb3ee45225975c0c9febe6608ff0a8c9477f9c2:tools/check_third_party_corpus.py > tools/check_third_party_corpus.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/check_third_party_corpus.py')
          text = p.read_text(encoding='utf-8')
          needle = '    "waiyan_start3": 1157,\n'
          replacement = needle + '    "jijiao_start3": 605,\n'
          if text.count(needle) != 1:
              raise SystemExit('Expected unique Waiyan baseline anchor')
          text = text.replace(needle, replacement)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -n -A8 'EXPECTED_SOURCE_COUNTS' tools/check_third_party_corpus.py

      - name: Commit repaired checker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add tools/check_third_party_corpus.py
          git commit -m 'test: restore full corpus checker with Jijiao baseline'
          git push
