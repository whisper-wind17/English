name: Prepare Third-party Jijiao Start3 Adapter

on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_third_party_jijiao_start3.py'
      - 'tools/check_third_party_jijiao_start3.py'
      - '1.全国各大教材版本中小学同步/冀教版/冀教版三年级起点*.xlsx'
      - '.github/workflows/prepare-third-party-jijiao-start3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: third-party-jijiao-start3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse Jijiao start3 source adapter
        run: python tools/prepare_third_party_jijiao_start3.py

      - name: Validate Jijiao start3 source adapter
        run: python tools/check_third_party_jijiao_start3.py

      - name: Assert Klose state is untouched
        run: |
          git diff --exit-code -- \
            anki/klose/master \
            anki/klose/learner \
            anki/klose/publish \
            anki/klose/anki \
            anki/klose/third_party_vocabulary

      - name: Persist source-adapter facts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add -A \
            anki/klose/source_reference/jijiao_start3_staging/README.md \
            anki/klose/source_reference/jijiao_start3_staging/occurrences.csv
          if git diff --cached --quiet; then
            echo 'No Jijiao start3 source-adapter changes.'
          else
            git commit -m 'data: capture Jijiao start3 source adapter'
            git push
          fi
