name: NCE1 Full Book Review Inputs
on:
  push:
    branches: [klose/nce1-full-release-20261102]
    paths: ['.github/workflows/nce1-full-review-inputs.yml']
permissions:
  contents: read
jobs:
  review-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package only learning-system review inputs
        run: |
          tar -czf /tmp/nce1-current-inputs.tar.gz AGENTS.md NEXT.md tools tests docs anki/klose anki/人教版一年级起点/master 8.新概念英语/新概念英语第一册（新版）.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: nce1-current-review-inputs
          path: /tmp/nce1-current-inputs.tar.gz
          retention-days: 7
