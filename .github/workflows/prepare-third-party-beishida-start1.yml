name: Prepare Third-party Beishida Start1 Adapter

on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_third_party_beishida_start1.py'
      - 'tools/check_third_party_beishida_start1.py'
      - '1.全国各大教材版本中小学同步/北师大/北师大版一年级起点*.xlsx'
      - '.github/workflows/prepare-third-party-beishida-start1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: third-party-beishida-start1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse Beishida start1 source adapter
        run: python tools/prepare_third_party_beishida_start1.py

      - name: Validate Beishida start1 source adapter
        run: python tools/check_third_party_beishida_start1.py

      - name: Assert Klose and third-party identity state is untouched
        run: |
          git diff --exit-code -- \
            anki/klose/master \
            anki/klose/learner \
            anki/klose/publish \
            anki/klose/anki \
            anki/klose/third_party_vocabulary

      - name: Persist source-adapter facts only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add -A \
            anki/klose/source_reference/beishida_start1_staging/README.md \
            anki/klose/source_reference/beishida_start1_staging/occurrences.csv
          if git diff --cached --quiet; then
            echo 'No Beishida start1 source-adapter changes.'
          else
            git commit -m 'data: capture Beishida start1 source adapter'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
