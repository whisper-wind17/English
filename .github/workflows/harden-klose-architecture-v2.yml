name: Harden Klose Architecture v2

on:
  push:
    branches: [main]
    paths:
      - 'tools/harden_klose_architecture_v2.py'
      - 'tools/harden-klose-architecture-v2.trigger'
      - '.github/workflows/harden-klose-architecture-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix one-time patcher replacement semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/harden_klose_architecture_v2.py')
          text = p.read_text(encoding='utf-8')
          old = 'new_text, count = re.subn(pattern, replacement.rstrip() + "\\n\\n", text, count=1, flags=re.S)'
          new = 'new_text, count = re.subn(pattern, lambda _: replacement.rstrip() + "\\n\\n", text, count=1, flags=re.S)'
          if old not in text:
              raise SystemExit('one-time patcher anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply architecture hardening
        run: python tools/harden_klose_architecture_v2.py

      - name: Align release membership with SourceItemKey
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_klose_vocabulary.py')
          text = p.read_text(encoding='utf-8')
          old = '        result[origin_key(row["Word"])] = grades'
          new = '        result[source_item_key(row["Word"])] = grades'
          if old not in text:
              raise SystemExit('source_grade_membership patch anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate persistent state
        run: python tools/check_klose_persistent_state.py

      - name: Rebuild baseline
        run: |
          python tools/build_klose_vocabulary.py
          python tools/apply_klose_learner_overrides.py
          python tools/check_klose_learner.py

      - name: Commit hardened architecture and rebuilt data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/KLOSE_VOCABULARY_SYSTEM.md anki/klose tools/build_klose_vocabulary.py tools/check_klose_persistent_state.py .github/workflows/build-klose-vocabulary.yml
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'refactor: harden Klose persistent vocabulary state'
          git push
