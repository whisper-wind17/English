name: Integrate Third-party Curriculum into Release Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-third-party-release-contract.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical release checker only
        run: |
          python - <<'PY'
          from pathlib import Path
          checker = Path('tools/check_klose_release_ready.py')
          text = checker.read_text(encoding='utf-8')
          start = text.index('def current_curriculum_ordered_note_ids()')
          end = text.index('def load_and_validate_admission(', start)
          replacement = '''def current_curriculum_ordered_note_ids() -> tuple[list[str], dict[str, tuple[str, str]]]:\n    """Derive textbook + explicit third-party curriculum without inventing source facts."""\n    from klose_release_curriculum import current_curriculum_ordered_note_ids as derive_release_curriculum\n    return derive_release_curriculum()\n\n'''
          checker.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Validate integrated release curriculum helper
        run: python tools/klose_release_curriculum.py
      - name: Syntax check canonical release checker
        run: python -m py_compile tools/check_klose_release_ready.py tools/klose_release_curriculum.py
      - name: Commit checker integration only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add tools/check_klose_release_ready.py
          changed="$(git diff --cached --name-only)"
          if [ "$changed" != 'tools/check_klose_release_ready.py' ]; then
            echo 'Unexpected integration diff:'
            echo "$changed"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'Canonical release checker already integrated.'
          else
            git commit -m 'feat: recognize third-party curriculum in release gate'
            git pull --rebase origin main
            git push
          fi
