name: Integrate Third-party Curriculum into Release Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-third-party-release-contract.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical release checker and build trigger
        run: |
          python - <<'PY'
          from pathlib import Path

          checker = Path('tools/check_klose_release_ready.py')
          text = checker.read_text(encoding='utf-8')
          start = text.index('def current_curriculum_ordered_note_ids()')
          end = text.index('def load_and_validate_admission(', start)
          replacement = '''def current_curriculum_ordered_note_ids() -> tuple[list[str], dict[str, tuple[str, str]]]:\n    """Derive textbook + explicit third-party curriculum without inventing source facts."""\n    from klose_release_curriculum import current_curriculum_ordered_note_ids as derive_release_curriculum\n    return derive_release_curriculum()\n\n'''
          checker.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          workflow = Path('.github/workflows/build-klose-vocabulary.yml')
          w = workflow.read_text(encoding='utf-8')
          needle = "      - 'tools/check_klose_release_ready.py'\n"
          addition = needle + "      - 'tools/klose_release_curriculum.py'\n"
          if "      - 'tools/klose_release_curriculum.py'\n" not in w:
              if needle not in w:
                  raise SystemExit('Build workflow release-check trigger anchor missing')
              w = w.replace(needle, addition, 1)
          workflow.write_text(w, encoding='utf-8')
          PY
      - name: Validate integrated release curriculum helper
        run: python tools/klose_release_curriculum.py
      - name: Syntax check canonical release checker
        run: python -m py_compile tools/check_klose_release_ready.py tools/klose_release_curriculum.py
      - name: Commit exact integration and self-delete workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git rm .github/workflows/integrate-third-party-release-contract.yml
          git add tools/check_klose_release_ready.py .github/workflows/build-klose-vocabulary.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/build-klose-vocabulary.yml' '.github/workflows/integrate-third-party-release-contract.yml' 'tools/check_klose_release_ready.py' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected integration diff:'
            echo "$changed"
            exit 1
          fi
          git commit -m 'feat: recognize third-party curriculum in release gate'
          git pull --rebase origin main
          git push
