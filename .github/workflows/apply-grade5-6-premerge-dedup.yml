name: Apply Grade 5-6 Premerge Dedup

on:
  push:
    branches: [main]
    paths:
      - 'tools/harden_grade5_6_dedup_consumers.py'
      - 'tools/apply_grade5_6_premerge_dedup.py'
      - 'tools/check_grade5_6_premerge_dedup.py'
      - '.github/workflows/apply-grade5-6-premerge-dedup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-grade5-6-premerge-dedup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reviewed dedup closure
        run: python tools/check_grade5_6_premerge_dedup.py
      - name: Harden downstream consumers
        run: python tools/harden_grade5_6_dedup_consumers.py
      - name: Apply explicit identity merge migrations
        run: python tools/apply_grade5_6_premerge_dedup.py
      - name: Validate Python syntax
        run: |
          python -m py_compile \
            tools/audit_grade5_6_premerge_dedup.py \
            tools/check_grade5_6_premerge_dedup.py \
            tools/apply_grade5_6_premerge_dedup.py \
            tools/allocate_klose_grade5_6_vocabulary.py \
            tools/apply_klose_grade5_6_current.py \
            tools/check_klose_persistent_state.py \
            tools/check_klose_grade5_6_current_merge.py
      - name: Verify migrated persistent state
        env:
          KLOSE_BASE_COMMIT: ${{ github.event.before || 'HEAD^' }}
        run: python tools/check_klose_persistent_state.py
      - name: Verify allocator is idempotent after dedup
        run: python tools/allocate_klose_grade5_6_vocabulary.py
      - name: Rebuild audit candidates against migrated state
        run: python tools/audit_grade5_6_premerge_dedup.py
      - name: Revalidate reviewed dedup against regenerated candidates
        run: python tools/check_grade5_6_premerge_dedup.py
      - name: Enforce migration diff scope
        shell: bash
        run: |
          allowed='^(tools/allocate_klose_grade5_6_vocabulary.py|tools/apply_klose_grade5_6_current.py|tools/audit_grade5_6_premerge_dedup.py|tools/check_klose_persistent_state.py|tools/check_klose_grade5_6_current_merge.py|anki/klose/master/note_registry_extensions.csv|anki/klose/master/source_identity_extensions.csv|anki/klose/master/identity_migrations.csv|anki/klose/review/grade5_6_reconciliation/vocabulary_decisions.csv|anki/klose/review/grade5_6_premerge_dedup/candidates.csv|anki/klose/review/grade5_6_premerge_dedup/status.json)$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected dedup migration mutation:'
            echo "$bad"
            exit 1
          fi
      - name: Persist reviewed dedup migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add \
            tools/allocate_klose_grade5_6_vocabulary.py \
            tools/apply_klose_grade5_6_current.py \
            tools/audit_grade5_6_premerge_dedup.py \
            tools/check_klose_persistent_state.py \
            tools/check_klose_grade5_6_current_merge.py \
            anki/klose/master/note_registry_extensions.csv \
            anki/klose/master/source_identity_extensions.csv \
            anki/klose/master/identity_migrations.csv \
            anki/klose/review/grade5_6_reconciliation/vocabulary_decisions.csv \
            anki/klose/review/grade5_6_premerge_dedup/candidates.csv \
            anki/klose/review/grade5_6_premerge_dedup/status.json
          if git diff --cached --quiet; then
            echo 'Dedup migration already applied.'
            exit 0
          fi
          git commit -m 'data: apply Grade 5-6 premerge identity dedup'
          git pull --rebase origin main
          git push origin HEAD:main
