name: Patch Grade 5-6 Dedup Gate State

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_grade5_6_dedup_gate_state.py'
      - '.github/workflows/patch-grade5-6-dedup-gate-state.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-grade5-6-dedup-gate-state
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stale post-dedup gates
        run: python tools/patch_grade5_6_dedup_gate_state.py
      - name: Validate syntax
        run: |
          python -m py_compile \
            tools/check_grade5_6_vocabulary_reconciliation_completion.py \
            tools/check_klose_grade5_6_current_merge.py
      - name: Validate reconciliation completion after patch
        run: python tools/check_grade5_6_vocabulary_reconciliation_completion.py
      - name: Validate current merge after patch
        run: python tools/check_klose_grade5_6_current_merge.py
      - name: Enforce narrow diff scope
        shell: bash
        run: |
          allowed='^(tools/check_grade5_6_vocabulary_reconciliation_completion.py|tools/check_klose_grade5_6_current_merge.py|anki/klose/review/grade5_6_reconciliation/vocabulary_status.json)$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected gate-state patch mutation:'
            echo "$bad"
            exit 1
          fi
      - name: Persist gate-state patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add \
            tools/check_grade5_6_vocabulary_reconciliation_completion.py \
            tools/check_klose_grade5_6_current_merge.py \
            anki/klose/review/grade5_6_reconciliation/vocabulary_status.json
          git commit -m 'fix: align Grade 5-6 completion gates with dedup truth'
          git pull --rebase origin main
          git push origin HEAD:main
