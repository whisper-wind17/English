name: Grade 5-6 Vocabulary Completion Recheck

on:
  push:
    branches: [main]
    paths:
      - 'tools/check_grade5_6_vocabulary_reconciliation_completion.py'
      - '.github/workflows/grade5-6-vocabulary-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            tools
            anki/klose/master
            anki/klose/review/grade5_6_reconciliation
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent Vocabulary completion recheck
        run: python tools/check_grade5_6_vocabulary_reconciliation_completion.py
      - name: Verify Stable Klose state was not mutated
        env:
          KLOSE_BASE_COMMIT: HEAD^
        run: python tools/check_klose_persistent_state.py
