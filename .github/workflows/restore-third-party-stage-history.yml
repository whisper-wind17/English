name: Restore Third-party Stage Audit Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-third-party-stage-history.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pre-learner Stage-A/B audit snapshot and self-delete
        shell: bash
        run: |
          set -euo pipefail
          BASE=bac19a8d3279d16e976c01dcae9a04fa6be564b0
          paths=(
            anki/klose/third_party_vocabulary/audit/stage_a_status.json
            anki/klose/third_party_vocabulary/premerge/identity_candidates.csv
            anki/klose/third_party_vocabulary/premerge/readiness.json
            anki/klose/third_party_vocabulary/premerge/reconciliation_next_batch.json
            anki/klose/third_party_vocabulary/premerge/reconciliation_review_queue.csv
            anki/klose/third_party_vocabulary/premerge/reconciliation_selected_view.csv
            anki/klose/third_party_vocabulary/reconciliation/reconciliation_decisions.csv
          )
          git checkout "$BASE" -- "${paths[@]}"
          git rm .github/workflows/restore-third-party-stage-history.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "${paths[@]}" .github/workflows/restore-third-party-stage-history.yml | sort)"
          test "$changed" = "$expected"
          git config user.name 'klose-stage-history-restore-bot'
          git config user.email 'klose-stage-history-restore-bot@users.noreply.github.com'
          git commit -m 'fix: restore Stage-A/B audit snapshot after learner work'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" || {
            echo 'main changed during audit restore; refusing stale push'
            exit 1
          }
          git push origin HEAD:main
