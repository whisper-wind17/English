name: Build Anki RJ Start1

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_anki_rj_start1.py'
      - 'tools/export_anki_review_input.py'
      - 'anki/人教版一年级起点/curation/*.csv'
      - '1.全国各大教材版本中小学同步/人教版/人教版一年级起点*.xlsx'
      - '.github/workflows/build-anki-rj-start1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            anki/人教版一年级起点
            1.全国各大教材版本中小学同步/人教版

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Anki CSV
        run: python tools/build_anki_rj_start1.py

      - name: Export review queues
        run: python tools/export_anki_review_input.py

      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anki/人教版一年级起点/master anki/人教版一年级起点/import anki/人教版一年级起点/review_input
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'data: rebuild Anki CSV for 人教版一年级起点'
          git push
