name: Build Klose Vocabulary

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_klose_vocabulary.py'
      - 'tools/apply_klose_actual_grade4.py'
      - 'tools/apply_klose_actual_grade4_reuse_facts.py'
      - 'tools/build_klose_learning_admission.py'
      - 'tools/apply_klose_learner_overrides.py'
      - 'tools/apply_klose_actual_grade4_reuse_learner.py'
      - 'tools/audit_klose_actual_grade4_reuse.py'
      - 'tools/sync_klose_learner_review_registry.py'
      - 'tools/revalidate_klose_baseline_v2.py'
      - 'tools/diagnose_klose_release_completeness.py'
      - 'tools/check_klose_learner.py'
      - 'tools/check_klose_release_ready.py'
      - 'tools/check_klose_persistent_state.py'
      - 'tools/check_klose_actual_grade4_identity.py'
      - 'tools/approve_klose_learner_review.py'
      - 'anki/klose/config/**'
      - 'anki/klose/source_reference/**'
      - 'anki/klose/anki/**'
      - 'anki/klose/learner/grade4_*overrides.csv'
      - 'anki/klose/learner/grade4_full_review_*.csv'
      - 'anki/klose/learner/actual_grade4_overrides.csv'
      - 'anki/klose/learner/actual_grade4_reuse_overrides.csv'
      - 'anki/klose/learner/learning_admission.csv'
      - 'anki/klose/learner/presentation_review_registry.csv'
      - 'anki/klose/learner/review_approvals/**'
      - 'anki/klose/master/note_registry.csv'
      - 'anki/klose/master/note_registry_extensions.csv'
      - 'anki/klose/master/actual_grade4_fact_overrides.csv'
      - 'anki/klose/master/actual_grade4_reuse_fact_overrides.csv'
      - 'anki/klose/master/source_identity_map.csv'
      - 'anki/klose/master/source_identity_extensions.csv'
      - 'anki/klose/master/source_reconciliation_registry.csv'
      - 'anki/klose/master/identity_migrations.csv'
      - 'anki/klose/master/release_registry.csv'
      - 'anki/klose/master/release_registry_extensions.csv'
      - 'anki/人教版一年级起点/master/vocabulary_master.csv'
      - 'anki/人教版一年级起点/master/vocabulary_occurrences.csv'
      - '.github/workflows/build-klose-vocabulary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**klose**.py'
      - 'anki/klose/**'
      - 'anki/人教版一年级起点/master/**'
      - '.github/workflows/build-klose-vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KLOSE_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools
            anki/klose
            anki/人教版一年级起点/master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Protect persistent identity and release state
        run: python tools/check_klose_persistent_state.py

      - name: Validate actual Grade-4 identity coverage
        run: python tools/check_klose_actual_grade4_identity.py

      - name: Audit reused Grade-4 identities
        run: python tools/audit_klose_actual_grade4_reuse.py

      - name: Build legacy vocabulary inventory
        run: python tools/build_klose_vocabulary.py

      - name: Overlay actual Klose Grade-4 source
        run: python tools/apply_klose_actual_grade4.py

      - name: Apply actual Grade-4 forms to reused identities
        run: python tools/apply_klose_actual_grade4_reuse_facts.py

      - name: Build explicit allowed/held learning admission
        run: python tools/build_klose_learning_admission.py

      - name: Apply learner presentation and learning admission
        run: python tools/apply_klose_learner_overrides.py

      - name: Apply actual Grade-4 reused learner presentations
        run: python tools/apply_klose_actual_grade4_reuse_learner.py

      - name: Sync learner review registry
        run: python tools/sync_klose_learner_review_registry.py

      - name: Explicitly revalidate unchanged baseline under fingerprint v2
        run: python tools/revalidate_klose_baseline_v2.py

      - name: Reject explicitly later auxiliary vocabulary in examples
        run: python tools/check_klose_learner.py

      - name: Diagnose current vs held release completeness
        run: python tools/diagnose_klose_release_completeness.py

      - id: release
        name: Verify content release readiness
        continue-on-error: true
        run: python tools/check_klose_release_ready.py

      - name: Report non-releasable development state
        if: steps.release.outcome != 'success'
        run: echo 'Build Valid; Content Releasable = false. Persisting reviewable upstream state only; publish remains blocked.'

      - name: Persist build-valid upstream state
        if: github.event_name == 'push' && steps.release.outcome != 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add \
            anki/klose/master/vocabulary_master.csv \
            anki/klose/master/source_occurrences.csv \
            anki/klose/master/build_stats.csv \
            anki/klose/learner/current.csv \
            anki/klose/learner/learning_admission.csv \
            anki/klose/learner/presentation_review_registry.csv \
            anki/klose/learner/review_approvals/grade4-baseline-v2-revalidated.csv \
            anki/klose/review
          if git diff --cached --quiet; then
            echo 'No upstream review-state changes.'
          else
            git commit -m 'data: persist Klose build-valid review state'
            git push
          fi

      - name: Commit releasable generated data
        if: github.event_name == 'push' && steps.release.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add anki/klose/master anki/klose/learner anki/klose/publish anki/klose/review
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'data: rebuild Klose vocabulary base'
            git push
          fi