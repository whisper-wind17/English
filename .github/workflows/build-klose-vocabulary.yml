name: Build Klose Vocabulary

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'anki/klose/**'
      - 'anki/人教版一年级起点/master/**'
      - '.github/workflows/build-klose-vocabulary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'anki/klose/**'
      - 'anki/人教版一年级起点/master/**'
      - '.github/workflows/build-klose-vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klose-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  KLOSE_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}

jobs:
  build-valid:
    name: Build Valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current upstream state
        run: python tools/klose_pipeline.py build --report "$RUNNER_TEMP/klose-build.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-status
          path: ${{ runner.temp }}/klose-build.json

  release-ready:
    name: Release Ready
    needs: build-valid
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate complete release at the checked-out commit
        run: python tools/klose_pipeline.py all --report "$RUNNER_TEMP/klose-release.json"
      - name: Regression and adversarial state checks
        run: python -m unittest discover -s tests -v
      - name: Validate and persist on main, fast-forward only
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/klose_pipeline.py all --persist --report "$RUNNER_TEMP/klose-release.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status
          path: ${{ runner.temp }}/klose-release.json
