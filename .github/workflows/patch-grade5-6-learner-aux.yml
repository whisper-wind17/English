name: Patch Grade 5-6 Learner Aux

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_grade5_6_learner_aux.py'
      - '.github/workflows/patch-grade5-6-learner-aux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools
            anki/klose/master
            anki/klose/learner
            anki/人教版一年级起点/master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch examples
        run: python tools/patch_grade5_6_learner_aux.py
      - name: Recheck learner content
        run: python tools/check_grade5_6_new_learner_content.py
      - name: Enforce narrow diff scope
        shell: bash
        run: |
          bad="$(git diff --name-only | grep -Ev '^(anki/klose/learner/grade5_6_content_batch_[abc]\.csv|tools/check_grade5_6_new_learner_content\.py)$' || true)"
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: Persist patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add anki/klose/learner/grade5_6_content_batch_*.csv tools/check_grade5_6_new_learner_content.py
          git commit -m 'data: remove later auxiliaries from Grade 5-6 learner examples'
          git pull --rebase origin main
          git push origin HEAD:main
