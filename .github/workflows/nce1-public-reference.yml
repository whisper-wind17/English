name: NCE1 Public Reference Capture
on:
  push:
    branches: [klose/nce1-full-release-20261102]
    paths: ['.github/workflows/nce1-public-reference.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve public vocabulary reference without modifying source facts
        run: |
          mkdir -p /tmp/nce1-public-reference
          python - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path
          import hashlib, json
          url='https://newconceptenglish.com/index.php?id=words'
          request=Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=urlopen(request,timeout=60).read()
          root=Path('/tmp/nce1-public-reference')
          (root/'reference.html').write_bytes(data)
          (root/'provenance.json').write_text(json.dumps({'URL':url,'SHA256':hashlib.sha256(data).hexdigest(),'Status':'reference-only-not-approved'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nce1-public-vocabulary-reference
          path: /tmp/nce1-public-reference/
          retention-days: 7
