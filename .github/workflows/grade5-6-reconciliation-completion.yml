name: Grade 5-6 Reconciliation Completion

on:
  push:
    branches: [main]
    paths:
      - 'tools/check_grade5_6_actual_textbook_source.py'
      - 'tools/check_grade5_6_actual_textbook_source_resolved.py'
      - 'tools/grade5_6_source_state.py'
      - 'tools/check_grade5_6_vocabulary_reconciliation_completion.py'
      - 'tools/check_grade5_6_expression_reconciliation_completion.py'
      - 'tools/check_klose_expressions_release_ready.py'
      - 'tools/check_grade5_6_premerge_dedup.py'
      - 'tools/check_klose_persistent_state.py'
      - 'tools/check_klose_expression_persistent_state.py'
      - 'anki/klose/source_reference/grade5_6_source_provenance.json'
      - 'anki/klose/source_reference/grade5_6_actual_textbook_manifest.csv'
      - 'anki/klose/source_reference/klose-actual-grade5-6-vocabulary.csv'
      - 'anki/klose/source_reference/klose-actual-grade5-6-morphology.csv'
      - 'anki/klose/source_reference/klose-actual-grade5-upper-expressions.csv'
      - 'anki/klose/source_reference/klose-actual-grade5-lower-expressions.csv'
      - 'anki/klose/source_reference/klose-actual-grade6-upper-expressions.csv'
      - 'anki/klose/source_reference/klose-actual-grade6-lower-expressions.csv'
      - 'anki/klose/source_reference/klose-actual-grade5-lower-proverbs.csv'
      - 'anki/klose/learner/grade5_6_learning_scope.json'
      - 'anki/klose/expressions/**'
      - 'anki/klose/review/grade5_6_reconciliation/vocabulary_candidates.csv'
      - 'anki/klose/review/grade5_6_reconciliation/vocabulary_decisions.csv'
      - 'anki/klose/review/grade5_6_reconciliation/vocabulary_status.json'
      - 'anki/klose/review/grade5_6_reconciliation/expression_source_candidates.csv'
      - 'anki/klose/review/grade5_6_reconciliation/expression_source_decisions.csv'
      - 'anki/klose/review/grade5_6_reconciliation/expression_identity_groups.csv'
      - 'anki/klose/review/grade5_6_reconciliation/expression_status.json'
      - 'anki/klose/review/grade5_6_premerge_dedup/**'
      - 'anki/klose/master/**'
      - '.github/workflows/grade5-6-reconciliation-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            tools
            anki/klose/source_reference
            anki/klose/learner/grade5_6_learning_scope.json
            anki/klose/master
            anki/klose/expressions
            anki/klose/review/grade5_6_reconciliation
            anki/klose/review/grade5_6_premerge_dedup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate resolved Grade 5-6 actual Source
        run: python tools/check_grade5_6_actual_textbook_source.py
      - name: Verify Grade 5-6 premerge dedup closure
        run: python tools/check_grade5_6_premerge_dedup.py
      - name: Independent Vocabulary reconciliation recheck
        run: python tools/check_grade5_6_vocabulary_reconciliation_completion.py
      - name: Validate Expression reconciliation or downstream release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f anki/klose/expressions/master/grade5_6_identity_allocation.csv ]]; then
            echo 'Grade 5-6 Expressions have crossed the downstream allocation boundary; validating the final release state.'
            python tools/check_klose_expressions_release_ready.py
          else
            python tools/check_grade5_6_expression_reconciliation_completion.py
          fi
      - name: Verify Stable Vocabulary persistent state
        env:
          KLOSE_BASE_COMMIT: HEAD^
        run: python tools/check_klose_persistent_state.py
      - name: Verify pre-allocation Stable Expression persistent state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f anki/klose/expressions/master/grade5_6_identity_allocation.csv ]]; then
            echo 'Post-allocation Expression state is protected by the final release gate above.'
          else
            KLOSE_BASE_COMMIT=HEAD^ python tools/check_klose_expression_persistent_state.py
          fi
