name: Third-party Stage-B Premerge Readiness

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_third_party_klose_premerge.py'
      - 'tools/check_third_party_klose_premerge.py'
      - 'tools/plan_third_party_stage_b_reconciliation.py'
      - 'tools/check_third_party_stage_b_review_plan.py'
      - 'tools/seal_third_party_stage_a_checkpoint.py'
      - 'anki/klose/third_party_vocabulary/staging/unified_vocabulary_preview.csv'
      - 'anki/klose/third_party_vocabulary/learner/learner_vocabulary_preview.csv'
      - 'anki/klose/third_party_vocabulary/staging/review_queue.csv'
      - 'anki/klose/third_party_vocabulary/audit/defer_context.csv'
      - 'anki/klose/third_party_vocabulary/audit/next_batch.json'
      - 'anki/klose/third_party_vocabulary/audit/stage_a_status.json'
      - 'anki/klose/third_party_vocabulary/reconciliation/reconciliation_decisions.csv'
      - 'anki/klose/master/note_registry.csv'
      - 'anki/klose/master/note_registry_extensions.csv'
      - '.github/workflows/third-party-stage-b-readiness.yml'
  workflow_run:
    workflows:
      - 'Prepare Third-party Vocabulary Stage A'
      - 'Allocate Grade 5-6 Klose Vocabulary'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: third-party-stage-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed Stage-A checkpoint
        run: python tools/seal_third_party_stage_a_checkpoint.py verify

      - name: Build read-only Third-party to Klose premerge candidates
        run: python tools/build_third_party_klose_premerge.py

      - name: Check Stage-B premerge readiness
        run: python tools/check_third_party_klose_premerge.py

      - name: Plan Stage-B reconciliation review
        run: python tools/plan_third_party_stage_b_reconciliation.py

      - name: Check Stage-B reconciliation review plan
        run: python tools/check_third_party_stage_b_review_plan.py

      - name: Assert build mutated only premerge derived state
        shell: bash
        run: |
          git status --short
          unexpected="$(git diff --name-only | grep -Ev '^anki/klose/third_party_vocabulary/premerge/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Readiness build mutated files outside third-party premerge:'
            echo "$unexpected"
            exit 1
          fi
          git diff --exit-code -- \
            anki/klose/master \
            anki/klose/learner \
            anki/klose/publish \
            anki/klose/anki

      - name: Persist premerge derived state only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+whisper-wind17@users.noreply.github.com'
          git add -A anki/klose/third_party_vocabulary/premerge
          if git diff --cached --quiet; then
            echo 'No premerge readiness changes.'
          else
            git commit -m 'data: refresh third-party Stage-B premerge readiness'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
