name: Third-party Allocation Plan Validation

on:
  push:
    branches: [main]
    paths:
      - 'tools/check_third_party_allocation_plan.py'
      - 'tools/validate_third_party_source_provenance.py'
      - 'tools/build_third_party_allocation_dry_run.py'
      - 'tools/validate_third_party_allocation_dry_run.py'
      - 'tools/apply_third_party_allocation.py'
      - 'tools/validate_third_party_allocation_simulation.py'
      - 'tools/validate_third_party_allocation_post_mutation.py'
      - 'tools/validate_third_party_allocation_committed_state.py'
      - 'docs/THIRD_PARTY_ALLOCATION_MIGRATION_PLAN.md'
      - 'docs/THIRD_PARTY_SOURCE_PROVENANCE_CONTRACT.md'
      - 'anki/klose/third_party_vocabulary/allocation/plan.json'
      - 'anki/klose/third_party_vocabulary/allocation/authorization.json'
      - 'anki/klose/third_party_vocabulary/allocation/execution_receipt.json'
      - 'anki/klose/third_party_vocabulary/provenance/contract.json'
      - 'anki/klose/third_party_vocabulary/provenance/stable_evidence_bindings.csv'
      - 'anki/klose/third_party_vocabulary/reconciliation/reconciliation_decisions.csv'
      - 'anki/klose/third_party_vocabulary/review/identity_decisions.csv'
      - 'anki/klose/third_party_vocabulary/premerge/identity_candidates.csv'
      - 'anki/klose/third_party_vocabulary/premerge/readiness.json'
      - 'anki/klose/third_party_vocabulary/premerge/reconciliation_next_batch.json'
      - 'anki/klose/third_party_vocabulary/staging/unified_vocabulary_preview.csv'
      - 'anki/klose/third_party_vocabulary/config/source_adapters.csv'
      - 'anki/klose/third_party_vocabulary/config/source_freeze.json'
      - 'anki/klose/third_party_vocabulary/staging/occurrences.csv'
      - 'anki/klose/source_reference/*_staging/occurrences.csv'
      - 'anki/klose/master/source_identity_extensions.csv'
      - 'anki/klose/master/note_registry.csv'
      - 'anki/klose/master/note_registry_extensions.csv'
      - '.github/workflows/third-party-allocation-plan.yml'
  workflow_run:
    workflows:
      - 'Third-party Stage-B Identity Reconciliation'
      - 'Allocate Grade 5-6 Klose Vocabulary'
      - 'Build Klose Vocabulary'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: third-party-allocation-plan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect allocation lifecycle state
        id: lifecycle
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path('anki/klose/third_party_vocabulary/allocation/execution_receipt.json')
          executed = False
          if p.exists():
              value = json.loads(p.read_text(encoding='utf-8-sig'))
              executed = value.get('Status') == 'executed-validated'
          print(f"executed={'true' if executed else 'false'}")
          PY

      - name: Validate durable committed allocation state
        if: steps.lifecycle.outputs.executed == 'true'
        run: python tools/validate_third_party_allocation_committed_state.py

      - name: Recheck persistent Stable identity invariants after allocation
        if: steps.lifecycle.outputs.executed == 'true'
        shell: bash
        run: |
          base="$(python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('anki/klose/third_party_vocabulary/allocation/execution_receipt.json').read_text(encoding='utf-8-sig'))
          print(value['AllocationBaseCommitSHA'])
          PY
          )"
          KLOSE_BASE_COMMIT="$base" python tools/check_klose_persistent_state.py

      - name: Assert committed-state validation is read-only
        if: steps.lifecycle.outputs.executed == 'true'
        run: |
          git status --short
          git diff --exit-code
          echo 'Committed allocation validation mutation = no'

      - name: Validate third-party source provenance contract
        if: steps.lifecycle.outputs.executed != 'true'
        run: python tools/validate_third_party_source_provenance.py

      - name: Validate allocation/migration control plane against current truth
        if: steps.lifecycle.outputs.executed != 'true'
        run: python tools/check_third_party_allocation_plan.py

      - name: Read allocation authorization state
        if: steps.lifecycle.outputs.executed != 'true'
        id: auth
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          value = json.loads(Path('anki/klose/third_party_vocabulary/allocation/authorization.json').read_text(encoding='utf-8-sig'))
          print(f"authorized={'true' if value.get('Authorized') is True else 'false'}")
          PY

      - name: Build mutation-disabled allocation dry run
        if: steps.lifecycle.outputs.executed != 'true'
        run: python tools/build_third_party_allocation_dry_run.py --output-dir "$RUNNER_TEMP/third-party-allocation-dry-run"

      - name: Independently validate allocation dry run
        if: steps.lifecycle.outputs.executed != 'true'
        run: python tools/validate_third_party_allocation_dry_run.py --output-dir "$RUNNER_TEMP/third-party-allocation-dry-run"

      - name: Assert actual allocation authorization gate is closed
        if: steps.lifecycle.outputs.executed != 'true' && steps.auth.outputs.authorized == 'false'
        run: python tools/apply_third_party_allocation.py --expect-unauthorized

      - name: Assert direct apply command fails closed
        if: steps.lifecycle.outputs.executed != 'true' && steps.auth.outputs.authorized == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if python tools/apply_third_party_allocation.py \
              --apply \
              --dry-run-dir "$RUNNER_TEMP/third-party-allocation-dry-run"; then
            echo 'Unauthorized --apply unexpectedly succeeded.'
            exit 1
          fi
          echo 'Unauthorized --apply = correctly rejected'
          git diff --exit-code

      - name: Confirm authorized state does not auto-apply
        if: steps.lifecycle.outputs.executed != 'true' && steps.auth.outputs.authorized == 'true'
        run: |
          echo 'Allocation control plane = authorized-pending-apply'
          echo 'This validation workflow never invokes --apply in the checked-out repository.'

      - name: Simulate guarded allocation outside repository
        if: steps.lifecycle.outputs.executed != 'true'
        run: >-
          python tools/apply_third_party_allocation.py
          --simulate
          --dry-run-dir "$RUNNER_TEMP/third-party-allocation-dry-run"
          --output-dir "$RUNNER_TEMP/third-party-allocation-simulation"

      - name: Independently validate simulated post-allocation state
        if: steps.lifecycle.outputs.executed != 'true'
        run: >-
          python tools/validate_third_party_allocation_simulation.py
          --dry-run-dir "$RUNNER_TEMP/third-party-allocation-dry-run"
          --simulation-dir "$RUNNER_TEMP/third-party-allocation-simulation"

      - name: Simulate interrupted transaction after registry append
        if: steps.lifecycle.outputs.executed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm "$RUNNER_TEMP/third-party-allocation-simulation/stable_evidence_bindings.csv"
          test -f "$RUNNER_TEMP/third-party-allocation-simulation/note_registry_extensions.csv"
          test ! -f "$RUNNER_TEMP/third-party-allocation-simulation/stable_evidence_bindings.csv"
          echo 'Simulated partial state = registry written / evidence bindings absent'

      - name: Retry simulation to recover interrupted transaction
        if: steps.lifecycle.outputs.executed != 'true'
        run: >-
          python tools/apply_third_party_allocation.py
          --simulate
          --dry-run-dir "$RUNNER_TEMP/third-party-allocation-dry-run"
          --output-dir "$RUNNER_TEMP/third-party-allocation-simulation"

      - name: Validate recovered simulated state
        if: steps.lifecycle.outputs.executed != 'true'
        run: >-
          python tools/validate_third_party_allocation_simulation.py
          --dry-run-dir "$RUNNER_TEMP/third-party-allocation-dry-run"
          --simulation-dir "$RUNNER_TEMP/third-party-allocation-simulation"

      - name: Re-run simulation to prove idempotent retry
        if: steps.lifecycle.outputs.executed != 'true'
        run: >-
          python tools/apply_third_party_allocation.py
          --simulate
          --dry-run-dir "$RUNNER_TEMP/third-party-allocation-dry-run"
          --output-dir "$RUNNER_TEMP/third-party-allocation-simulation"

      - name: Revalidate idempotent simulated state
        if: steps.lifecycle.outputs.executed != 'true'
        run: >-
          python tools/validate_third_party_allocation_simulation.py
          --dry-run-dir "$RUNNER_TEMP/third-party-allocation-dry-run"
          --simulation-dir "$RUNNER_TEMP/third-party-allocation-simulation"

      - name: Exercise authorized apply and commit transaction in isolated clone
        if: steps.lifecycle.outputs.executed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tx="$RUNNER_TEMP/third-party-allocation-transaction"
          dry="$RUNNER_TEMP/third-party-allocation-transaction-dry-run"
          git clone --quiet "$GITHUB_WORKSPACE" "$tx"
          cd "$tx"
          git config user.name 'allocation-transaction-test'
          git config user.email 'allocation-transaction-test@example.invalid'

          python - <<'PY'
          import json
          from pathlib import Path
          plan_path = Path('anki/klose/third_party_vocabulary/allocation/plan.json')
          auth_path = Path('anki/klose/third_party_vocabulary/allocation/authorization.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8-sig'))
          auth = json.loads(auth_path.read_text(encoding='utf-8-sig'))
          plan['MutationGates']['ActualMutationAuthorized'] = True
          plan['MutationGates']['StableNoteIDAllocationAuthorized'] = True
          for key in ('MasterSourceMappingMutationAuthorized', 'LearnerMutationAuthorized', 'ReleaseMutationAuthorized', 'PublishMutationAuthorized', 'AnkiMutationAuthorized'):
              plan['MutationGates'][key] = False
          auth['Authorized'] = True
          auth['UserAuthorizationEvidence'] = 'CI isolated transaction test only; no repository authorization'
          auth['AuthorizedAt'] = '2026-09-11T00:00:00Z'
          plan_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          auth_path.write_text(json.dumps(auth, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add anki/klose/third_party_vocabulary/allocation/plan.json \
                  anki/klose/third_party_vocabulary/allocation/authorization.json
          git commit --quiet -m 'test: isolated allocation authorization transition'
          authorization_base="$(git rev-parse HEAD)"

          python tools/validate_third_party_source_provenance.py
          python tools/check_third_party_allocation_plan.py
          python tools/build_third_party_allocation_dry_run.py --output-dir "$dry"
          python tools/validate_third_party_allocation_dry_run.py --output-dir "$dry"
          python tools/apply_third_party_allocation.py --apply --dry-run-dir "$dry"
          KLOSE_BASE_COMMIT="$authorization_base" python tools/check_klose_persistent_state.py
          python tools/validate_third_party_allocation_post_mutation.py \
            --dry-run-dir "$dry" --base-ref "$authorization_base"
          git diff --check

          git add anki/klose/master/note_registry_extensions.csv \
                  anki/klose/third_party_vocabulary/provenance/stable_evidence_bindings.csv
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'anki/klose/master/note_registry_extensions.csv' \
            'anki/klose/third_party_vocabulary/provenance/stable_evidence_bindings.csv' | sort)"
          test "$staged" = "$expected"
          git commit --quiet -m 'test: isolated third-party Stable allocation transaction'

          KLOSE_BASE_COMMIT="$authorization_base" python tools/check_klose_persistent_state.py
          python tools/validate_third_party_allocation_post_mutation.py \
            --dry-run-dir "$dry" --base-ref "$authorization_base"
          committed="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          test "$committed" = "$expected"
          echo 'Isolated authorized allocation transaction + commit gate = pass'
          echo 'Remote push = no'

      - name: Assert pre-execution validation is read-only
        if: steps.lifecycle.outputs.executed != 'true'
        run: |
          git status --short
          git diff --exit-code
          echo 'Allocation control-plane validation mutation = no'
